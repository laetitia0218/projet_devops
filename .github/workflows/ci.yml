name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t projet-devops-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy & Smoke Test (Staging)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Déploiement réel de la stack (API + PostgreSQL) sur le runner, qui joue le rôle de staging
      - name: Deploy to Staging (docker compose)
        run: |
          docker compose up -d --build
          docker compose ps

      # Smoke test RÉEL : le job échoue si l'API ne répond pas ou si la base n'est pas connectée (R3, R5)
      - name: Execute Smoke Test (GET /health)
        run: |
          for i in $(seq 1 30); do
            if BODY=$(curl -fsS http://localhost:8000/health); then
              echo "Réponse /health : $BODY"
              if echo "$BODY" | grep -q '"database":"connected"'; then
                echo "Smoke test OK : API et base de données répondent."
                exit 0
              fi
            fi
            echo "Tentative $i/30 : service pas encore prêt..."
            sleep 2
          done
          echo "::error::Smoke test KO : /health ne répond pas ou la base n'est pas connectée."
          docker compose logs api
          exit 1

      - name: Stop staging
        if: always()
        run: docker compose down -v
