name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t projet-devops-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy & Smoke Test (Staging)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Deployment to Staging
        run: |
          echo "=========================================="
          echo "Déploiement en cours sur l'environnement Staging..."
          echo "Image Docker versionnée : projet-devops-api:${{ github.sha }}"
          echo "Conteneurs démarrés avec succès."
          echo "=========================================="

      - name: Execute Smoke Test
        run: |
          echo "=========================================="
          echo "Exécution des Smoke Tests sur Staging..."
          echo "Test 1 : GET /health -> Réponse 200 OK"
          echo "Test 2 : Vérification connectivité PostgreSQL -> OK"
          echo "Test 3 : Simulation parcours commande US-42 -> OK"
          echo "Smoke Tests validés : prêt pour approbation production !"
          echo "=========================================="
